<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="t">
  <title id="t">ProofSender mimarisi: web katmanı, kuyruk, internete kapalı analiz motoru ve bulgu modeli</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <style>
      .box{fill:#161b22;stroke:#30363d;stroke-width:1.5}
      .hi{stroke:#22d3ee}
      .h{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
      .s{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#8b949e}
      .e{stroke:#22d3ee;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .l{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#22d3ee}
    </style>
  </defs>
  <rect width="1100" height="330" rx="12" fill="#0d1117"/>

  <!-- sources -->
  <rect class="box" x="20" y="30" width="200" height="70" rx="8"/>
  <text class="h" x="36" y="60">Microsoft 365</text><text class="s" x="36" y="82">Graph · OAuth · Mail.Read</text>
  <rect class="box" x="20" y="130" width="200" height="70" rx="8"/>
  <text class="h" x="36" y="160">Gmail</text><text class="s" x="36" y="182">API · OAuth · readonly</text>
  <rect class="box" x="20" y="230" width="200" height="70" rx="8"/>
  <text class="h" x="36" y="260">Alan adı (DNS)</text><text class="s" x="36" y="282">sahiplik doğrulanınca</text>

  <!-- web -->
  <rect class="box" x="290" y="95" width="230" height="140" rx="8"/>
  <text class="h" x="306" y="125">Web katmanı</text>
  <text class="s" x="306" y="150">PHP Laravel + Livewire</text>
  <text class="s" x="306" y="172">hesap · organizasyon · rol</text>
  <text class="s" x="306" y="194">veri izolasyonu</text>
  <text class="s" x="306" y="216">ham e-posta saklanmaz</text>

  <rect class="box" x="290" y="260" width="230" height="50" rx="8"/>
  <text class="s" x="306" y="290" style="fill:#e6edf3">PostgreSQL · Redis</text>

  <!-- engine -->
  <rect class="box hi" x="600" y="95" width="230" height="140" rx="8"/>
  <text class="h" x="616" y="125">Analiz motoru</text>
  <text class="s" x="616" y="150">Python 3.12 · FastAPI</text>
  <text class="s" x="616" y="172">internete kapalı</text>
  <text class="s" x="616" y="194">132 tespit kuralı</text>
  <text class="s" x="616" y="216">OCR · makro · karekod</text>

  <!-- finding -->
  <rect class="box" x="890" y="60" width="190" height="210" rx="8"/>
  <text class="h" x="906" y="90">Bulgu (TR / EN)</text>
  <text class="s" x="906" y="118">1 ne bulundu</text>
  <text class="s" x="906" y="144">2 neden önemli</text>
  <text class="s" x="906" y="170">3 kanıt</text>
  <text class="s" x="906" y="196">4 nasıl düzeltilir</text>
  <text class="s" x="906" y="222">5 nasıl doğrulanır</text>
  <text class="s" x="906" y="252" style="fill:#f472b6">engellemez, uyarır</text>

  <!-- edges -->
  <path class="e" d="M220 65 C255 65 255 130 288 130"/>
  <path class="e" d="M220 165 H288"/>
  <path class="e" d="M220 265 C255 265 255 200 288 200"/>
  <path class="e" d="M520 165 H598"/><text class="l" x="537" y="155">kuyruk</text>
  <path d="M405 235 V258" stroke="#30363d" stroke-width="1.8"/>
  <path class="e" d="M830 165 H888"/>
</svg>
